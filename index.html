<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo — Inteligencia Artificial (3.6)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211934;
    --cream:#F7F3EC;
    --violet:#6B3FA0;
    --violet-dark:#4B2A73;
    --magenta:#E4567C;
    --gold:#D9A441;
    --line:#D9D2E8;
    --card-shadow: 0 10px 30px rgba(33,25,52,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 8% 12%, rgba(107,63,160,0.14) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(228,86,124,0.12) 0, transparent 40%),
      var(--cream);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:28px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{text-align:center;margin-bottom:22px;}
  .kicker{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.04em;color:var(--violet);margin-bottom:4px;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:44px;
    line-height:1;
    margin:0 0 6px;
    color:var(--ink);
  }
  h1 span{color:var(--magenta);}
  .subtitle{font-size:15px;color:#5b5270;max-width:440px;margin:0 auto;}

  .controls{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin:22px 0 18px;
  }
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:11px 18px;
    border-radius:10px;
    border:2px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:hover{transform:translateY(-1px);}
  button:active{transform:translateY(0px) scale(.98);}
  button.secondary{
    background:transparent;
    color:var(--ink);
  }
  button.secondary:hover{background:rgba(33,25,52,0.06);}

  .status{
    text-align:center;
    font-size:14px;
    color:#5b5270;
    margin-bottom:16px;
    min-height:20px;
  }
  .status b{color:var(--violet-dark);}

  .card-id{
    text-align:center;
    font-size:13px;
    color:#8a80a0;
    margin-bottom:10px;
    font-variant-numeric: tabular-nums;
  }

  .board{
    background:#fff;
    border:3px solid var(--ink);
    border-radius:18px;
    box-shadow:var(--card-shadow);
    padding:12px;
    overflow:hidden;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:8px;
    aspect-ratio:1/1;
  }
  .cell{
    position:relative;
    overflow:hidden;
    border:2px solid var(--line);
    border-radius:12px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6px;
    cursor:pointer;
    user-select:none;
    transition: background .16s ease, border-color .16s ease, transform .1s ease;
  }
  .cell:hover{border-color:var(--violet);}
  .cell:active{transform:scale(.96);}
  .cell .label{
    font-size:12.5px;
    font-weight:600;
    line-height:1.15;
    color:var(--ink);
    transition:color .16s ease;
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .cell.free{
    background:var(--gold);
    border-color:var(--gold);
    cursor:default;
  }
  .cell.free .label{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:15px;
    color:#fff;
  }
  .cell.marked{
    background:var(--violet);
    border-color:var(--violet-dark);
  }
  .cell.marked .label{color:#fff;}
  .cell.marked::after{
    content:"";
    position:absolute;
    inset:6px;
    border:2px solid rgba(255,255,255,0.55);
    border-radius:8px;
    transform:rotate(-4deg);
    pointer-events:none;
  }

  footer{
    text-align:center;
    margin-top:26px;
    font-size:12px;
    color:#a89dc0;
  }

  @media (max-width:420px){
    h1{font-size:34px;}
    .cell .label{font-size:10.5px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">IB Digital Society — Repaso 3.6</div>
    <h1>Bingo de <span>IA</span></h1>
    <p class="subtitle">Escuchá la definición que lee tu profesor/a y hacé clic en el término que corresponda en tu carta.</p>
  </header>

  <div class="controls">
    <button id="newCardBtn">🔀 Nuevo Bingo</button>
    <button id="resetBtn" class="secondary">↺ Borrar marcas</button>
  </div>

  <div class="status" id="status">Marcá los términos a medida que los escuchás.</div>
  <div class="card-id" id="cardId"></div>

  <div class="board">
    <div class="grid" id="grid"></div>
  </div>

  <footer>37 términos · 3.6A–3.6E · Cada carta se genera al azar</footer>
</div>

<script>
// Los mismos 37 términos de la guía de estudio 3.6
const TERMS = [
  "Inteligencia artificial","IA débil / estrecha","IA de dominio específico","IA fuerte (AGI)",
  "Superinteligencia (ASI)","Prueba de Turing","Aprendizaje automático","Aprendizaje supervisado",
  "Aprendizaje no supervisado","Aprendizaje por refuerzo","Aprendizaje profundo","Reconocimiento de patrones",
  "Reconocimiento facial","Reconocimiento de voz","PLN","Análisis de imágenes","Red neuronal artificial",
  "Capa de entrada","Capa oculta","Capa de salida","Peso (conexión)","Función de activación",
  "IA en ciencia ficción","Cibernética","Invierno de la IA","Sistema experto",
  "Verano de la IA","Singularidad","Multiplicidad","Sesgo algorítmico","Equidad en IA","Responsabilidad",
  "Transparencia","Caja negra","Legislación desigual","Automatización","Desplazamiento laboral"
];

const FREE_INDEX = 12; // centro de una grilla 5x5 (0-indexado)
let currentTerms = [];
let marked = new Set([FREE_INDEX]);
let cardNumber = 0;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildCard(){
  cardNumber++;
  const pool = shuffle(TERMS).slice(0,24);
  currentTerms = [...pool.slice(0,12), "GRATIS", ...pool.slice(12)];
  marked = new Set([FREE_INDEX]);
  render();
  document.getElementById('cardId').textContent = "Carta N.º " + cardNumber;
  setStatus("Marcá los términos a medida que los escuchás.");
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = "";
  currentTerms.forEach((term, idx)=>{
    const cell = document.createElement('div');
    cell.className = 'cell' + (idx===FREE_INDEX ? ' free' : '') + (marked.has(idx) ? ' marked' : '');
    cell.dataset.idx = idx;
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = term;
    cell.appendChild(label);
    if(idx !== FREE_INDEX){
      cell.addEventListener('click', ()=>toggleCell(idx));
    }
    grid.appendChild(cell);
  });
}

function toggleCell(idx){
  if(marked.has(idx)) marked.delete(idx);
  else marked.add(idx);
  render();
}

function setStatus(msg){
  document.getElementById('status').innerHTML = msg;
}

document.getElementById('newCardBtn').addEventListener('click', buildCard);
document.getElementById('resetBtn').addEventListener('click', ()=>{
  marked = new Set([FREE_INDEX]);
  render();
  setStatus("Marcas borradas. Misma carta, a empezar de nuevo.");
});

buildCard();
</script>
</body>
</html>
